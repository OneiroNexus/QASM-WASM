name: Verify research software
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - name: Install compiler and WASM linker
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Rebuild numerical core from C
        run: bash wasm-core/build.sh
      - name: Run original and persistent-runtime checks
        run: python tools/verify.py --output out/ci-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-logs
          path: out/ci-tests

